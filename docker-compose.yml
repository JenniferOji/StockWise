services:
  postgres:
    image: postgres:16
    container_name: stockwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nnedimma11
      POSTGRES_DB: stockwise_db
    ports:
      - "5432:5432"
    volumes:
      - stockwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockwise_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockwise_pgdata:
