version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: stockwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - stockwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: stockwise-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
      ML_API_URL: ${ML_API_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
    ports:
      - "8080:8080"

  fastapi:
    build: ./services
    container_name: stockwise-fastapi
    environment:
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
    container_name: stockwise-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  stockwise_pgdata: